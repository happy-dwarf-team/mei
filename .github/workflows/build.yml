name: build

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml to build the packages of a new release; run by hand to build
  # the font atlases of a branch too.
  workflow_call:
    inputs:
      ref:
        description: The commit or tag to build; empty builds the commit that started the run
        type: string
        default: ''
      fonts:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      fonts:
        description: Build the font atlases too (about six minutes)
        type: boolean
        default: true

# A new push to a pull request cancels its older runs of this workflow. Other
# runs (main, the weekly scan, a release's build) get a group of their own and
# are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Only the submodules the build uses: the original at its pinned commit and
      # its utfcpp (MinHook and SafetyHook stay out).
      - name: Submodules
        run: |
          git submodule update --init upstream
          git -C upstream submodule update --init vendor/utfcpp

      # Ninja with sccache in front of cl: a run compiles only the sources whose
      # inputs changed since the cached run. The MSVC environment (cl, link, rc on
      # PATH, INCLUDE, LIB) comes from vcvars64.bat, as a Developer prompt has it,
      # saved to msvc.env and loaded only by the steps that run cl: for the whole
      # job it would also make rustc in a bash step link with Git's link.exe.
      - name: sccache
        shell: pwsh
        env:
          SCCACHE_VERSION: v0.19.0
          SCCACHE_SHA256: 28be8c61f6b2c89b9eb2869f6af7f78e6f992e78a8abae0ce855fcc129cbeac1
        run: |
          $name = "sccache-$env:SCCACHE_VERSION-x86_64-pc-windows-msvc"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mozilla/sccache/releases/download/$env:SCCACHE_VERSION/$name.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:SCCACHE_SHA256) { throw "$name.zip: SHA-256 mismatch" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP $name | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "SCCACHE_DIR=$(Join-Path $env:RUNNER_TEMP sccache)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SCCACHE_CACHE_SIZE=1G" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: MSVC environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          # Only what vcvars64.bat adds or changes, not the runner's own GITHUB_* and the rest.
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            $name, $value = $_ -split '=', 2
            if ($name -and $null -ne $value -and [Environment]::GetEnvironmentVariable($name) -ne $value) { "$name=$value" }
          } | Out-File (Join-Path $env:RUNNER_TEMP msvc.env) -Encoding utf8

      # Only pushes and pull requests use the cache: a release build (release.yml
      # passes a ref) is compiled from the sources alone, and a run by hand builds
      # the fonts of any branch. FetchContent fetches only the Anvil SDK here, so
      # build/_deps is not cached (CodeQL counts a workspace cache in a workflow
      # with workflow_dispatch as cache poisoning, whatever its condition).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ inputs.ref == '' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sccache-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        run: |
          Get-Content (Join-Path $env:RUNNER_TEMP msvc.env) |
            ForEach-Object { $name, $value = $_ -split '=', 2; Set-Item "env:$name" $value }
          cmake -S . -B build -G "Ninja Multi-Config" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        shell: pwsh
        run: |
          Get-Content (Join-Path $env:RUNNER_TEMP msvc.env) |
            ForEach-Object { $name, $value = $_ -split '=', 2; Set-Item "env:$name" $value }
          cmake --build build --config Release
          sccache --show-stats

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      # CI has no eu4.exe, so `anvil check` checks the schemas, that every text
      # of plugin.toml and settings.toml has a translation in all eight files of
      # translations/ (--complete-translations), and that symbols.lock matches
      # symbols.toml with result = "ok".
      - name: anvil check
        shell: pwsh
        run: |
          $anvil = 'build/_deps/anvil_sdk-src/bin/anvil.exe'
          if (-not (Test-Path $anvil)) { Write-Output "::error::$anvil not found"; exit 1 }
          & $anvil --version
          & $anvil check . --format github --complete-translations
          exit $LASTEXITCODE

      # mei/ as Anvil loads it, with the package's SHA256SUMS.txt.
      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --component plugin --prefix dist/package
          $files = Get-ChildItem dist/package -Recurse -File
          $files | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath('dist/package', $_.FullName).Replace('\', '/')
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $relative
          } | Set-Content dist/package/SHA256SUMS.txt
          Compress-Archive -Path dist/package/* -DestinationPath dist/mei-${{ github.sha }}.zip

      # Per-commit artifact; for a release, release.yml attaches it to the GitHub release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mei-${{ github.sha }}
          path: dist/mei-${{ github.sha }}.zip

      # The Steam Workshop mod of workshop.toml is workshop/ with the plugin folder in
      # anvil/mei/ and the fonts in gfx/fonts/mei/, neither in Git. A dry run of
      # paradox-workshop-publish writes to the job summary what a release would publish
      # (files, descriptor, the rendered descriptions) and fails when the mod would change
      # the EU4 checksum (checksum = "keep"). The fonts take six minutes to build, so the
      # preview here has the plugin only; the fonts job below builds them. It needs no
      # secrets and sends nothing to Steam.
      - name: Stage the Workshop mod
        shell: pwsh
        run: |
          Remove-Item workshop/anvil -Recurse -Force -ErrorAction Ignore
          New-Item -ItemType Directory workshop/anvil -Force | Out-Null
          Copy-Item dist/package/mei workshop/anvil/mei -Recurse

      # Pinned to a release tag, not a commit: the action installs the pdx-ws
      # release named by its own tag and verifies that release's attestation.
      - name: Workshop preview
        uses: happy-dwarf-team/paradox-workshop-publish@7366a4306b3c81157837bcdce7f138bc86e5d50b # v1.0.0
        with:
          pdx-ws-version: v1.0.0
          dry-run: true

  # Mei's font atlases (fonts/README.md) from the pinned Source Han Sans release; for
  # releases and by hand, not on every pull request.
  fonts:
    if: inputs.fonts
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Submodules
        run: |
          git submodule update --init upstream
          git -C upstream submodule update --init vendor/utfcpp

      - name: Build the atlas tool
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --target meifonts

      - name: Build the atlases
        shell: pwsh
        run: |
          ./tools/build-fonts.ps1 -MeiFonts build/Release/meifonts.exe -Out dist/fonts | Set-Content dist/fonts-SHA256SUMS.txt
          Get-Content dist/fonts-SHA256SUMS.txt
          Compress-Archive -Path dist/fonts/* -DestinationPath dist/mei-fonts-${{ github.sha }}.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mei-fonts-${{ github.sha }}
          path: dist/mei-fonts-${{ github.sha }}.zip
