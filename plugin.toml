id = "mei"
name = "Mei"
version = "0.7.1"
authors = ["VulonLok (EU4 Unicode Patch)", "Happy Dwarf Team"]
description = "Chinese, Japanese and Korean text for a translation mod: UTF-8 and EU4DLL encodings, fonts, line breaks, pinyin search and typing. A port of EU4 Unicode Patch by VulonLok."
api = 2
anvil = ">=1.9.0"
entry = "mei.dll"
# Early: the original's lexer and localisation hooks must be in place before the
# game reads its data (later steps).
phase = "early"
symbols = "symbols.toml"
settings = "settings.toml"
# Text, input and search only. Name order, which changes generated characters,
# is planned as a separate plugin.
affects_gameplay = false
issues = "https://github.com/happy-dwarf-team/mei/issues"
repository = "https://github.com/happy-dwarf-team/mei"
