id = "unicode-patch"
name = "Unicode Patch"
version = "0.0.0"
authors = ["VulonLok (EU4 Unicode Patch)", "Happy Dwarf Team (Anvil port)"]
description = "UTF-8 text for EU4: a port of EU4 Unicode Patch by VulonLok. So far: Chinese and pinyin search in the diplomacy country list and the province finder."
api = 2
entry = "unicode_patch.dll"
# Early: the original's lexer and localisation hooks must be in place before the
# game reads its data (later steps).
phase = "early"
symbols = "symbols.toml"
settings = "settings.toml"
# Text, input and search only. Name order, which changes generated characters,
# is planned as a separate plugin.
affects_gameplay = false
issues = "https://github.com/happy-dwarf-team/anvil/issues/104"
