# Mei's settings. The player's values live in anvil/data/mei/settings.toml;
# the overlay's panel edits them.
# They replace the original's plugins/eu4_unicode_patch/config.ini.

[setting.search]
type = "bool"
# On with the localisation import: the game's own lower-casing and accent stripping
# break UTF-8 names (README.md "In-game test of the localisation import").
default = true
label = "Chinese and pinyin search"
description = "The diplomacy country list and the province finder also match Chinese characters, full pinyin, initials and mixed input."
restart = true

[setting.utf8_localization]
type = "bool"
# On: a translation mod's text shows without configuration. The text blocks,
# the font loader and the map blocks come with it.
default = true
label = "UTF-8 localisation"
description = "The game keeps its localisation in UTF-8 and draws it, and EU4DLL translation packs' escapes become UTF-8. Keep the search on with it: the game's own search misses accented names in UTF-8."
restart = true

[setting.utf8_scripts]
type = "bool"
# Needs utf8_localization, whose text blocks draw these names. Only the text of
# names changes (README.md "Script and save lexer").
default = true
label = "UTF-8 in scripts and saves"
description = "Script files and saves may be in UTF-8, with or without a signature, and EU4DLL escapes in them become UTF-8, so names from a supplementary translation mod show as they read. Saves written with it keep those names in UTF-8."
restart = true

[setting.bundled_fonts]
type = "bool"
# Needs utf8_localization, which loads the fonts' glyphs above U+00FF.
default = true
label = "Mei's fonts"
description = "Where the game would use one of its own fonts, which have no Chinese, Japanese or Korean letters, it uses Mei's (Source Han Sans) instead. Fonts that a translation mod brings with such letters stay."
restart = true

[setting.utf8_input]
type = "bool"
# On: typing is part of what Mei is for. Selection by character and undo are
# not ported, and the IME's candidate window is not checked (README.md "State").
default = true
label = "UTF-8 text input"
description = "Typed and IME-committed text reaches text fields as UTF-8, so Chinese, Japanese and Korean can be typed. Backspace, Delete and the arrow keys step by character; selections and undo do not yet."
restart = true

[setting.typo_tolerance]
type = "bool"
default = true
label = "Allow one typo in long pinyin"
description = "Full pinyin of 5 or more letters still matches with one letter inserted, deleted, replaced or two neighbours swapped."
restart = true

[setting.fuzzy_pinyin]
type = "bool"
default = false
label = "Fuzzy pinyin"
description = "zh/z, ch/c, sh/s, n/l, en/eng and in/ing match each other."
restart = true
