# Unicode Patch's settings. The player's values live in
# anvil/data/unicode-patch/settings.toml; the overlay's panel edits them.
# They replace the original's plugins/eu4_unicode_patch/config.ini.

[setting.search]
type = "bool"
# Off until the diplomacy country list is checked in the game (README.md "State").
default = false
label = "Chinese and pinyin search"
description = "The diplomacy country list and the province finder also match Chinese characters, full pinyin, initials and mixed input."
restart = true

[setting.utf8_localization]
type = "bool"
# Off until the text editor and the original's own font atlases are ported:
# the interface and map blocks draw UTF-8, the editor still reads it as
# Windows-1252, and without `search` the province finder loses accented names
# (README.md "State").
default = false
label = "UTF-8 localisation (experimental)"
description = "The game keeps its localisation in UTF-8, as the original does, and draws it. Chinese, Japanese and Korean need fonts that hold them (from a mod for now); without them those letters show as '?'. Turn on the search with it: the game's own search misses accented names in UTF-8."
restart = true

[setting.typo_tolerance]
type = "bool"
default = true
label = "Allow one typo in long pinyin"
description = "Full pinyin of 5 or more letters still matches with one letter inserted, deleted, replaced or two neighbours swapped."
restart = true

[setting.fuzzy_pinyin]
type = "bool"
default = false
label = "Fuzzy pinyin"
description = "zh/z, ch/c, sh/s, n/l, en/eng and in/ing match each other."
restart = true
