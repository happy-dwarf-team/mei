# The plugin's texts in Polish: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Chinese, Japanese and Korean text for a translation mod: UTF-8 and EU4DLL encodings, fonts, line breaks, pinyin search and typing. A port of EU4 Unicode Patch by VulonLok." = "Tekst chiński, japoński i koreański dla moda z tłumaczeniem: kodowania UTF-8 i EU4DLL, czcionki, łamanie wierszy, wyszukiwanie pinyinem i pisanie. Port EU4 Unicode Patch autorstwa VulonLoka."
"Chinese and pinyin search" = "Wyszukiwanie po chińsku i pinyinem"
"The diplomacy country list and the province finder also match Chinese characters, full pinyin, initials and mixed input." = "Lista państw w dyplomacji i wyszukiwarka prowincji dopasowują też znaki chińskie, pełny pinyin, inicjały i wpisy mieszane."
"UTF-8 localisation" = "Lokalizacja w UTF-8"
"The game keeps its localisation in UTF-8 and draws it, and EU4DLL translation packs' escapes become UTF-8. Keep the search on with it: the game's own search misses accented names in UTF-8." = "Gra przechowuje lokalizację w UTF-8 i ją wyświetla, a sekwencje ucieczki z paczek tłumaczeń EU4DLL stają się UTF-8. Zostaw przy tym włączone wyszukiwanie: wyszukiwanie samej gry nie znajduje w UTF-8 nazw ze znakami diakrytycznymi."
"UTF-8 in scripts and saves" = "UTF-8 w skryptach i zapisach"
"Script files and saves may be in UTF-8, with or without a signature, and EU4DLL escapes in them become UTF-8, so names from a supplementary translation mod show as they read. Saves written with it keep those names in UTF-8." = "Pliki skryptów i zapisy mogą być w UTF-8, z sygnaturą lub bez, a sekwencje ucieczki EU4DLL w nich stają się UTF-8, więc nazwy z uzupełniającego moda z tłumaczeniem wyglądają tak, jak się je pisze. Zapisy utworzone z tym ustawieniem zachowują te nazwy w UTF-8."
"Mei's fonts" = "Czcionki Mei"
"Where the game would use one of its own fonts, which have no Chinese, Japanese or Korean letters, it uses Mei's (Source Han Sans) instead. Fonts that a translation mod brings with such letters stay." = "Tam, gdzie gra użyłaby jednej ze swoich czcionek, które nie mają znaków chińskich, japońskich ani koreańskich, używa zamiast niej czcionek Mei (Source Han Sans). Czcionki z takimi znakami, które przynosi mod z tłumaczeniem, zostają."
"UTF-8 text input" = "Wpisywanie tekstu w UTF-8"
"Typed and IME-committed text reaches text fields as UTF-8, so Chinese, Japanese and Korean can be typed. Keys, the mouse, selections, undo and paste step by character." = "Tekst wpisany z klawiatury i zatwierdzony w IME trafia do pól tekstowych jako UTF-8, więc można pisać po chińsku, japońsku i koreańsku. Klawisze, mysz, zaznaczanie, cofanie i wklejanie działają znak po znaku."
"UTF-8 save names" = "Nazwy zapisów w UTF-8"
"Saves keep the country's name and the name you type as they read, such as 奥斯曼1444_11_11.eu4, instead of Latin letters, so two countries no longer get the same file name. A game with EU4DLL shows such names garbled." = "Zapisy zachowują nazwę państwa i wpisaną nazwę tak, jak się je pisze, np. 奥斯曼1444_11_11.eu4, zamiast liter łacińskich, więc dwa państwa nie dostają już tej samej nazwy pliku. Gra z EU4DLL pokazuje takie nazwy jako nieczytelne znaki."
"Dates and battle titles in CJK word order" = "Daty i tytuły bitew w szyku CJK"
"With a Chinese, Japanese or Korean translation, dates read 1444年11月11日 or 1444년 11월 11일, and battles, sieges and occupations put the place first, such as 瓦尔纳战役 or 바르나 전투." = "Z tłumaczeniem chińskim, japońskim lub koreańskim daty mają postać 1444年11月11日 lub 1444년 11월 11일, a bitwy, oblężenia i okupacje zaczynają się od miejsca, np. 瓦尔纳战役 lub 바르나 전투."
"Allow one typo in long pinyin" = "Dopuść jedną literówkę w długim pinyinie"
"Full pinyin of 5 or more letters still matches with one letter inserted, deleted, replaced or two neighbours swapped." = "Pełny pinyin z 5 lub więcej liter pasuje nadal, gdy jedna litera jest dodana, usunięta lub zamieniona albo dwie sąsiednie są przestawione."
"Fuzzy pinyin" = "Przybliżony pinyin"
"zh/z, ch/c, sh/s, n/l, en/eng and in/ing match each other." = "zh/z, ch/c, sh/s, n/l, en/eng oraz in/ing pasują do siebie nawzajem."
