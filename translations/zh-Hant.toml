# The plugin's texts in Traditional Chinese: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Chinese, Japanese and Korean text for a translation mod: UTF-8 and EU4DLL encodings, fonts, line breaks, pinyin search and typing. A port of EU4 Unicode Patch by VulonLok." = "為翻譯模組提供中文、日文與韓文文字支援：UTF-8 與 EU4DLL 編碼、字型、換行、拼音搜尋與輸入。移植自 VulonLok 的 EU4 Unicode Patch。"
"Chinese and pinyin search" = "中文與拼音搜尋"
"The diplomacy country list and the province finder also match Chinese characters, full pinyin, initials and mixed input." = "外交介面的國家列表與省份搜尋也能比對漢字、全拼、首字母以及混合輸入。"
"UTF-8 localisation" = "UTF-8 在地化"
"The game keeps its localisation in UTF-8 and draws it, and EU4DLL translation packs' escapes become UTF-8. Keep the search on with it: the game's own search misses accented names in UTF-8." = "遊戲以 UTF-8 保存並顯示在地化文字，EU4DLL 翻譯包的跳脫字元也會轉換為 UTF-8。開啟此項時請保持搜尋開啟：遊戲內建的搜尋在 UTF-8 下找不到帶重音符號的名稱。"
"UTF-8 in scripts and saves" = "腳本與存檔中的 UTF-8"
"Script files and saves may be in UTF-8, with or without a signature, and EU4DLL escapes in them become UTF-8, so names from a supplementary translation mod show as they read. Saves written with it keep those names in UTF-8." = "腳本檔案與存檔可以使用 UTF-8（帶或不帶 BOM），其中的 EU4DLL 跳脫字元會轉換為 UTF-8，因此補充翻譯模組中的名稱會正常顯示。開啟此項後寫入的存檔會以 UTF-8 保留這些名稱。"
"Mei's fonts" = "Mei 的字型"
"Where the game would use one of its own fonts, which have no Chinese, Japanese or Korean letters, it uses Mei's (Source Han Sans) instead. Fonts that a translation mod brings with such letters stay." = "遊戲原本使用內建字型（不含中文、日文或韓文字元）的地方，會改用 Mei 的字型（思源黑體）。翻譯模組自帶的含有這些字元的字型保持不變。"
"UTF-8 text input" = "UTF-8 文字輸入"
"Typed and IME-committed text reaches text fields as UTF-8, so Chinese, Japanese and Korean can be typed. Keys, the mouse, selections, undo and paste step by character." = "鍵入的文字與輸入法確定的文字以 UTF-8 送入文字欄位，因此可以輸入中文、日文與韓文。按鍵、滑鼠、選取、復原與貼上都以字元為單位移動。"
"UTF-8 save names" = "UTF-8 存檔名稱"
"Saves keep the country's name and the name you type as they read, such as 奥斯曼1444_11_11.eu4, instead of Latin letters, so two countries no longer get the same file name. A game with EU4DLL shows such names garbled." = "存檔會按原樣保留國家名稱與你輸入的名稱，例如 奥斯曼1444_11_11.eu4，而不是轉換為拉丁字母，因此兩個國家不會再得到相同的檔名。使用 EU4DLL 的遊戲會把這類名稱顯示為亂碼。"
"Dates and battle titles in CJK word order" = "依中日韓語序顯示日期與戰役標題"
"With a Chinese, Japanese or Korean translation, dates read 1444年11月11日 or 1444년 11월 11일, and battles, sieges and occupations put the place first, such as 瓦尔纳战役 or 바르나 전투." = "使用中文、日文或韓文翻譯時，日期顯示為 1444年11月11日 或 1444년 11월 11일，戰役、圍城與佔領會把地名放在前面，例如 瓦尔纳战役 或 바르나 전투。"
"Allow one typo in long pinyin" = "長拼音允許一處錯字"
"Full pinyin of 5 or more letters still matches with one letter inserted, deleted, replaced or two neighbours swapped." = "5 個以上字母的全拼在多一個、少一個、錯一個字母或相鄰兩個字母顛倒時仍能比對。"
"Fuzzy pinyin" = "模糊拼音"
"zh/z, ch/c, sh/s, n/l, en/eng and in/ing match each other." = "zh/z、ch/c、sh/s、n/l、en/eng 與 in/ing 互相比對。"
